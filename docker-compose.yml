  web:
    build:
      context: ./hackathon-app
      args:
        VITE_OPS_API_URL: ${OPS_API_URL:-/ops-api} # same-origin proxy -> no CORS
        VITE_SHOW_DEMO_USERS: ${SHOW_DEMO_USERS:-false} # true = print the demo logins on the sign-in page (demo builds only)
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '${HTTP_PORT:-8080}:80'

