# Foooh! full stack: Postgres + API + UI, one command:   docker compose up -d --build
#   UI  -> http://<server>:8080   nginx. The browser calls the API through /ops-api on the SAME origin,
#                                 so there is no cross-origin request and no CORS problem.
#   API -> http://<server>:8888   FastAPI (login + all data). Direct calls from the 8080 UI origin are
#                                 also allowed by CORS_ORIGINS, in case something calls :8888 directly.
#   DB  -> 127.0.0.1:5433 on the server only (use an SSH tunnel). Created from backend/db/init/ the
#          FIRST time the volume is empty.
name: hackathon

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: fogops
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    ports:
      - '127.0.0.1:${DB_PORT:-5433}:5432'
    volumes:
      - fogops-data:/var/lib/postgresql/data
      - ./backend/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d fogops']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s # first start restores the dump

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      FOGOPS_DSN: postgresql://${DB_USER:-postgres}:${DB_PASSWORD}@db:5432/fogops
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-FogOps@2026}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://130.61.182.207:8080,http://localhost:3000}
      # Ask (free-text questions). Leave empty and only the suggested questions work.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ASK_MODEL: ${ASK_MODEL:-claude-haiku-5-5}
      ASK_MAX_TOKENS: ${ASK_MAX_TOKENS:-400}
      ASK_RATE_PER_MIN: ${ASK_RATE_PER_MIN:-6}
      ASK_DAILY_LIMIT: ${ASK_DAILY_LIMIT:-150}
      # Swagger / OpenAPI map every endpoint: off unless you set ENABLE_DOCS=1 in .env (dev machines)
      ENABLE_DOCS: ${ENABLE_DOCS:-0}
    ports:
      # the browser reaches the API through the web container (/ops-api), so the API port stays on this machine only.
      # Set API_BIND=0.0.0.0 in .env if something else must call :8888 directly.
      - '${API_BIND:-127.0.0.1}:${API_PORT:-8888}:8000'
