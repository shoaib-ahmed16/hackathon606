# UI container -> Spring Boot backend running on the Docker host (port 8888).
# The browser only talks to this nginx (same origin), so there is no CORS.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }

  # FogOps API = Spring Boot on the host. The trailing slash strips /ops-api.
  # Buffering off + long timeout keep the live (Server-Sent Events) stream open.
  location /ops-api/ {
    proxy_pass http://host.docker.internal:8888/;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # same-origin for the browser; without this Spring sees Origin: http://localhost:8080 and answers "Invalid CORS request"
    proxy_set_header Origin "";
    proxy_buffering off;
    proxy_read_timeout 3600s;
  }
}
