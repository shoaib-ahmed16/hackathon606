# UI in Docker against the Spring Boot backend running on the host (http://localhost:8888):
#   docker compose -f docker-compose.spring.yml up -d --build      ->  http://localhost:8080
services:
  web:
    build:
      context: .
      args:
        VITE_OPS_API_URL: /ops-api      # same-origin; nginx.spring.conf forwards it to the host's :8888
    volumes:
      - ./nginx.spring.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '8080:80'
    restart: unless-stopped
