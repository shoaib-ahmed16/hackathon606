server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # hashed build assets: cache for a year
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA routing: unknown paths -> index.html (never cache it)
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }

  # Clearway API (Spring Boot, service `app`) inside the compose network. Trailing slash strips /ops-api.
  # Buffering off + long timeout so the Server-Sent Events stream (/ops-api/api/stream) stays open.
  location /ops-api/ {
    proxy_pass http://app:8888/;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # same-origin for the browser; without this Spring sees Origin: http://<host>:8080 and answers "Invalid CORS request"
    proxy_set_header Origin "";
    proxy_buffering off;
    proxy_read_timeout 3600s;
  }

}
