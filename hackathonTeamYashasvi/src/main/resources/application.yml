logging:
  level:
    org:
      springframework: info

server:
  port: 8888

spring:
  application:
    name: security-micro-service
  datasource:
    url: jdbc:postgresql://localhost:5432/${DB_NAME:hackathon_yashasvi}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  data:
    jdbc:
      repositories:
        enabled: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false


jwt:
  security:
    token:
      secret_key: ${JWT_SECRET_KEY:abMcdefgIhijk4lmnoXpqrsZtuvwxyzYafeA}
      validity: 360000
      issuer: ashoaib.security@gmail.com
      subject: emartSalesPlatform@gmail.com

management:
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
  endpoints:
    web:
      exposure:
        include: health
